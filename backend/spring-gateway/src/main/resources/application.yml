server:
  port: 8080

spring:
  application:
    name: spring-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
            allowCredentials: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
