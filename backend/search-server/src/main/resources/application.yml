server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}
      database: ${MONGODB_DATABASE}
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    admin:
      auto-create: true

elasticsearch:
  host: ${ES_HOST}
  port: ${ES_PORT}
  scheme: ${ES_SCHEME}

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

